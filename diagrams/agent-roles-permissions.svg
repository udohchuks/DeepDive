<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>pi agent roles and permission scoping</title>
<desc>Raw repository and student text flows only into the Verifier session, which has read-only tools. The Verifier reduces everything to structured findings before they reach the Grader plus hint session, which has no filesystem tools at all. The Scaffolder session has write, edit, and bash tools but is restricted by a tool_call permission hook to scaffold and test paths only, and is blocked from ever writing into the graded artifact itself.</desc>

<defs>
<marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"></path>
</marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"></path>
</marker>
</defs>

<rect x="0" y="0" width="700" height="460" fill="#ffffff"></rect>

<g>
<rect x="255" y="20" width="190" height="55" rx="10" fill="#FAECE7" stroke="#D85A30"></rect>
<text x="270" y="45" font-size="13" fill="#4A1B0C" font-family="sans-serif" font-weight="500">Raw repo &amp; student text</text>
<text x="270" y="62" font-size="11" fill="#712B13" font-family="sans-serif">untrusted, unlabeled</text>
</g>

<g>
<rect x="40" y="115" width="190" height="150" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="55" y="140" font-size="14" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Scaffolder</text>
<text x="55" y="162" font-size="12" fill="#5F5E5A" font-family="sans-serif">write, edit, bash</text>
<text x="55" y="180" font-size="11" fill="#888780" font-family="sans-serif">scoped to /scaffold, /tests</text>
<text x="55" y="198" font-size="11" fill="#888780" font-family="sans-serif">via tool_call hook (§4)</text>
<text x="55" y="222" font-size="11" fill="#5F5E5A" font-family="sans-serif">writes stubs, boilerplate,</text>
<text x="55" y="238" font-size="11" fill="#5F5E5A" font-family="sans-serif">test harnesses</text>
</g>

<g>
<rect x="255" y="115" width="190" height="150" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="270" y="140" font-size="14" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Verifier</text>
<text x="270" y="162" font-size="12" fill="#5F5E5A" font-family="sans-serif">read, grep/find, bash (ro)</text>
<text x="270" y="182" font-size="11" fill="#888780" font-family="sans-serif">only role that reads raw</text>
<text x="270" y="198" font-size="11" fill="#888780" font-family="sans-serif">repo / student text</text>
<text x="270" y="222" font-size="11" fill="#5F5E5A" font-family="sans-serif">checks citations, traces</text>
<text x="270" y="238" font-size="11" fill="#5F5E5A" font-family="sans-serif">flows, runs the test suite</text>
</g>

<g>
<rect x="470" y="115" width="190" height="150" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="485" y="140" font-size="14" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Grader + hint</text>
<text x="485" y="162" font-size="12" fill="#5F5E5A" font-family="sans-serif">no filesystem tools</text>
<text x="485" y="182" font-size="11" fill="#888780" font-family="sans-serif">never sees raw repo or</text>
<text x="485" y="198" font-size="11" fill="#888780" font-family="sans-serif">student text</text>
<text x="485" y="222" font-size="11" fill="#5F5E5A" font-family="sans-serif">structured verdict only —</text>
<text x="485" y="238" font-size="11" fill="#5F5E5A" font-family="sans-serif">questions, flags, hint_ref</text>
</g>

<g>
<rect x="40" y="320" width="190" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56"></rect>
<text x="55" y="345" font-size="12" fill="#04342C" font-family="sans-serif" font-weight="500">/scaffold, /tests</text>
<text x="55" y="363" font-size="11" fill="#0F6E56" font-family="sans-serif">writable</text>
</g>

<g>
<rect x="255" y="320" width="190" height="60" rx="10" fill="#F1EFE8" stroke="#888780"></rect>
<text x="270" y="345" font-size="12" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Graded artifact</text>
<text x="270" y="363" font-size="11" fill="#5F5E5A" font-family="sans-serif">SDD / RSDD / CDD — write blocked</text>
</g>

<line x1="255" y1="75" x2="255" y2="113" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)"></line>

<line x1="230" y1="185" x2="253" y2="185" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)"></line>
<text x="230" y="245" font-size="11" fill="#5F5E5A" font-family="sans-serif" text-anchor="end"></text>

<line x1="445" y1="185" x2="468" y2="185" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr2)"></line>
<text x="447" y="175" font-size="10" fill="#0F6E56" font-family="sans-serif">structured findings only</text>

<line x1="135" y1="265" x2="135" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr2)"></line>

<path d="M 200 265 C 230 290 280 300 300 318" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrRed)"></path>
<text x="200" y="300" font-size="10" fill="#A32D2D" font-family="sans-serif">blocked by tool_call hook</text>

<text x="40" y="420" font-size="11" fill="#888780" font-family="sans-serif">Role split makes "AI never authors graded work" (P-2) enforceable by construction, not by prompting.</text>

</svg>
