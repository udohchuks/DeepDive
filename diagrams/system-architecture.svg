<svg viewBox="0 0 700 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Local-only system architecture</title>
<desc>A single local application boundary contains the VS Code extension, a local orchestrator holding phase state and gates with no round cap, sandboxed pi sessions running the scaffolder, verifier, grader, and hint roles, the project's own test runner, and local SQLite storage for artifacts, rubrics, and records. Only two things leave the machine: calls to the AI model API for inference, and git operations against GitHub for cloning and opening pull requests.</desc>

<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"></path>
</marker>
</defs>

<rect x="0" y="0" width="700" height="640" fill="#ffffff"></rect>

<rect x="30" y="55" width="640" height="440" rx="12" fill="none" stroke="#B4B2A9" stroke-dasharray="4 3"></rect>
<text x="45" y="42" font-size="13" fill="#5F5E5A" font-family="sans-serif">Local application — single install, no backend service</text>

<g>
<rect x="250" y="80" width="200" height="80" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="270" y="113" font-size="15" fill="#2C2C2A" font-family="sans-serif" font-weight="500">VS Code extension</text>
<text x="270" y="135" font-size="12" fill="#5F5E5A" font-family="sans-serif">Editor, review panel, hints</text>
</g>

<g>
<rect x="250" y="215" width="200" height="80" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="270" y="248" font-size="15" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Local orchestrator</text>
<text x="270" y="270" font-size="12" fill="#5F5E5A" font-family="sans-serif">Phase state, no round cap</text>
</g>

<g>
<rect x="50" y="350" width="190" height="95" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="68" y="383" font-size="15" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Sandboxed pi sessions</text>
<text x="68" y="404" font-size="12" fill="#5F5E5A" font-family="sans-serif">Scaffolder, verifier,</text>
<text x="68" y="420" font-size="12" fill="#5F5E5A" font-family="sans-serif">grader, hint</text>
</g>

<g>
<rect x="255" y="350" width="190" height="95" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="273" y="383" font-size="15" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Test runner</text>
<text x="273" y="404" font-size="12" fill="#5F5E5A" font-family="sans-serif">Project's real test suite</text>
</g>

<g>
<rect x="460" y="350" width="190" height="95" rx="12" fill="#F1EFE8" stroke="#B4B2A9"></rect>
<text x="478" y="383" font-size="15" fill="#2C2C2A" font-family="sans-serif" font-weight="500">Local storage</text>
<text x="478" y="404" font-size="12" fill="#5F5E5A" font-family="sans-serif">SQLite — artifacts, rubrics,</text>
<text x="478" y="420" font-size="12" fill="#5F5E5A" font-family="sans-serif">skill graph, records</text>
</g>

<g>
<rect x="100" y="555" width="190" height="70" rx="12" fill="#FAEEDA" stroke="#BA7517"></rect>
<text x="118" y="588" font-size="14" fill="#412402" font-family="sans-serif" font-weight="500">AI model API</text>
<text x="118" y="608" font-size="12" fill="#633806" font-family="sans-serif">Model inference, remote</text>
</g>

<g>
<rect x="410" y="555" width="190" height="70" rx="12" fill="#FAEEDA" stroke="#BA7517"></rect>
<text x="428" y="588" font-size="14" fill="#412402" font-family="sans-serif" font-weight="500">Git / GitHub</text>
<text x="428" y="608" font-size="12" fill="#633806" font-family="sans-serif">Clone, push, open PRs</text>
</g>

<line x1="350" y1="160" x2="350" y2="213" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"></line>
<text x="362" y="192" font-size="11" fill="#5F5E5A" font-family="sans-serif">submit / status</text>

<line x1="280" y1="295" x2="160" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"></line>
<text x="170" y="330" font-size="11" fill="#5F5E5A" font-family="sans-serif">dispatch role / result</text>

<line x1="240" y1="397" x2="255" y2="397" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"></line>
<text x="195" y="385" font-size="11" fill="#5F5E5A" font-family="sans-serif">run suite</text>

<line x1="420" y1="295" x2="540" y2="348" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"></line>
<text x="440" y="330" font-size="11" fill="#5F5E5A" font-family="sans-serif">artifacts &amp; rubrics</text>

<line x1="150" y1="445" x2="185" y2="553" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"></line>
<text x="150" y="500" font-size="11" fill="#5F5E5A" font-family="sans-serif">model calls</text>

<line x1="230" y1="445" x2="470" y2="553" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"></line>
<text x="300" y="495" font-size="11" fill="#5F5E5A" font-family="sans-serif">clone / push / PR</text>

</svg>
